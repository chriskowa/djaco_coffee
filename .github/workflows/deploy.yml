name: Deploy to DomaiNesia

on:
  push:
    branches:
      - main  # Branch yang dipantau untuk perubahan

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}        # Host IP DomaiNesia (misal: 36.50.77.81)
          username: ${{ secrets.SSH_USER }}    # Username cPanel DomaiNesia (misal: ruangdid)
          key: ${{ secrets.SSH_PRIVATE_KEY }}  # Private key dari GitHub Secrets
          port: 64000                          # Port SSH DomaiNesia (64000)
          script: |
            # 1. Deteksi direktori target di hosting DomaiNesia
            TARGET_DIR="/home/ruangdid/djaco.web.id"
            if [ ! -d "$TARGET_DIR" ] && [ -d "/home/ruangdid/public_html/djaco.web.id" ]; then
              TARGET_DIR="/home/ruangdid/public_html/djaco.web.id"
            fi

            echo "📁 Target direktori deploy: $TARGET_DIR"
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR" || exit 1

            # Amankan api/config.php di server agar tidak tertimpa/terhapus saat git reset
            if [ -f "api/config.php" ]; then
              echo "🔒 Mengamankan api/config.php di server sebelum deploy..."
              cp api/config.php /tmp/djaco_config_backup.php
            fi

            # 2. Inisialisasi otomatis jika belum ada git di server
            if [ ! -d ".git" ]; then
              echo "🔄 Menginisialisasi repositori baru di server..."
              git init
              git remote add origin https://github.com/chriskowa/djaco_coffee.git || true
              git fetch origin main
              git reset --hard origin/main
              git branch -M main
            else
              echo "⬇️ Mengambil pembaruan terbaru dari origin/main..."
              git remote set-url origin https://github.com/chriskowa/djaco_coffee.git || true
              git fetch origin main
              git reset --hard origin/main
            fi

            # Pulihkan api/config.php dari cadangan lokal server
            if [ -f "/tmp/djaco_config_backup.php" ]; then
              echo "🔑 Memulihkan api/config.php di server..."
              cp /tmp/djaco_config_backup.php api/config.php
              rm -f /tmp/djaco_config_backup.php
            elif [ ! -f "api/config.php" ] && [ -f "api/config.example.php" ]; then
              echo "⚠️ api/config.php belum ada, menyalin dari api/config.example.php..."
              cp api/config.example.php api/config.php
            fi

            echo "✅ Deployment selesai! Commit aktif:"
            git log -1 --oneline
