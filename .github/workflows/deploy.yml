name: Deploy to DomaiNesia

on:
  push:
    branches:
      - main  # Branch yang dipantau untuk perubahan

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}        # Host IP DomaiNesia (misal: 36.50.77.81)
          username: ${{ secrets.SSH_USER }}    # Username cPanel DomaiNesia (misal: ruangdid)
          key: ${{ secrets.SSH_PRIVATE_KEY }}  # Private key dari GitHub Secrets
          port: ${{ secrets.SSH_PORT || 64000 }} # Port SSH DomaiNesia (default: 64000)
          script: |
            cd /home/ruangdid/djaco.web.id
            git pull origin main
